<!doctype html>
<html lang="sk"><head><meta charset="utf-8"><meta name="viewport" content="width=390"><title>Nápad 5 · mobil · otvorené menu</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css" rel="stylesheet">
<style>
:root{--prim:#E0B84C;--dark:#1E2A44;--card:#F8F5EE}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;background:var(--dark);color:#fff;font-family:Manrope,sans-serif;font-size:15px;display:flex;flex-direction:column}
.bar{display:flex;justify-content:space-between;align-items:center;padding:14px 16px}
.logo{font-weight:800;font-size:18px;display:flex;align-items:center;gap:8px}
.logo i{background:var(--prim);color:var(--dark);border-radius:7px;width:28px;height:28px;display:grid;place-items:center;font-size:17px}
.x{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:22px}
ul{list-style:none;padding:12px 16px}
li{display:flex;align-items:center;gap:14px;padding:16px 4px;border-bottom:1px solid rgba(255,255,255,.12);font-size:18px;font-weight:700}
li i{font-size:22px;color:var(--prim)}
li span{margin-left:auto;color:#9AA3B8;font-size:20px}
.bottom{margin-top:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.btn{border-radius:12px;padding:14px;text-align:center;font-weight:800}
.y{background:var(--prim);color:var(--dark)}.o{border:1px solid rgba(255,255,255,.3)}
</style></head><body>
<div class="bar"><div class="logo"><i class="ti ti-tool"></i>Hodinový majster</div><div class="x"><i class="ti ti-x"></i></div></div>
<ul>
<li><i class="ti ti-search"></i>Nájsť službu<span>›</span></li>
<li><i class="ti ti-clipboard-list"></i>Moje objednávky<span>›</span></li>
<li><i class="ti ti-heart"></i>Uložené<span>›</span></li>
<li><i class="ti ti-info-circle"></i>Ako to funguje<span>›</span></li>
<li><i class="ti ti-tool"></i>Pre majstrov<span>›</span></li>
</ul>
<div class="bottom"><div class="btn y">+ Pridať službu</div><div class="btn o">Prihlásiť sa</div></div>
</body></html>
