spring.application.name=hodinovy-majster
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fx}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
app.jwt.secret=${JWT_SECRET}
# AES key for 2FA secrets in the database (Base64 of 32 random bytes). Without it the key is derived from JWT_SECRET.
app.totp.encryption-key=${TOTP_ENCRYPTION_KEY:}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
# Public address of the website, used for links in e-mails.
app.frontend-url=${FRONTEND_URL:http://localhost:4200}
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
# Flyway owns the schema (src/main/resources/db/migration). An existing database without
# Flyway history (school server) is marked as version 1 and gets only the newer migrations.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# E-mail: needs spring.mail.host etc. (SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
# Links in e-mails end with the token.
app.password-reset.link=${PASSWORD_RESET_LINK:http://localhost:4200/obnova-hesla?token=}
app.email-verification.link=${EMAIL_VERIFICATION_LINK:http://localhost:4200/overenie-emailu?token=}
app.mail.from=${MAIL_FROM:no-reply@hodinovy-majster.local}
app.mail.log-without-server=false
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Profile photos: up to 2 MB (PhotoService checks the size too).
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
# Swagger UI at /swagger-ui.html, JSON at /v3/api-docs. Turn off on a public server with
# SPRINGDOC_SWAGGER_UI_ENABLED=false and SPRINGDOC_API_DOCS_ENABLED=false.
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
