# Explicit, local presentation mode. No school/PostgreSQL connection.
server.address=127.0.0.1
spring.datasource.url=jdbc:h2:mem:hodinovy-demo;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# In-memory demo database is built by Hibernate, not by Flyway.
spring.flyway.enabled=false
# No mail server in the demo: e-mails are written to the console.
app.mail.log-without-server=true
spring.h2.console.enabled=false
app.demo=true
app.demo-accounts=true
